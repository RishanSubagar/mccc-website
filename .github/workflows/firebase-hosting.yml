# Firebase Hosting GitHub Action dispatch workflow
# This workflow is triggered manually via the "Run workflow" button in the GitHub Actions tab
# It builds the project and deploys it to Firebase Hosting using the Firebase CLI GitHub Action

name: Deploy to Firebase Hosting
on:
  workflow_dispatch:
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MCCC_WEBSITE_13BCF }}
          projectId: mccc-website-13bcf
